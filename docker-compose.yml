services:
  label-studio:
    build:
      context: .
      network: host
    ports:
      - "3001:3001"
    environment:
      - JWT_SECRET=${JWT_SECRET?Please set JWT_SECRET}
      - PORT=3001
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - NODE_ENV=production
      - HERMES_URL=http://hermes:3002
    volumes:
      - label-studio-data:/app/server
    depends_on:
      hermes:
        condition: service_healthy
    restart: unless-stopped

  hermes:
    build:
      context: .
      dockerfile: hermes/Dockerfile
      network: host
    volumes:
      - .:/workspace
      - hermes-config:/app/config
    environment:
      - HERMES_PORT=3002
      - WORKSPACE_PATH=/workspace
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: host
    ports:
      - "3000:80"
    depends_on:
      - label-studio
    restart: unless-stopped

volumes:
  label-studio-data:
  hermes-config:
