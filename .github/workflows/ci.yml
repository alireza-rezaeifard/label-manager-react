name: CI

on:
  pull_request:
    branches: [main, taxbook-v2]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Backend tests
        working-directory: server
        run: |
          npm ci
          JWT_SECRET=ci-test-secret-0123456789abcdef0123456789abcdef npm test

      - name: npm audit (frontend)
        run: npm audit --audit-level=high || true

      - name: npm audit (backend)
        working-directory: server
        run: npm audit --audit-level=high || true

  docker:
    needs: quality
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/taxbook-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t taxbook-backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t taxbook-frontend:${{ github.sha }} .
